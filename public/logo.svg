<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Harvor H Icon</title>
  <desc id="desc">Navy rounded square with a transparent H cutout.</desc>
  <defs>
    <mask id="h-cutout" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="white"/>

      <!-- Left vertical cutout -->
      <rect x="129" y="116" width="54" height="280" rx="27" fill="black"/>

      <!-- Right vertical cutout -->
      <rect x="329" y="116" width="54" height="280" rx="27" fill="black"/>

      <!-- Curved bridge cutout -->
      <path
        fill="black"
        d="M183 240
           C220 260 263 264 329 226
           L329 280
           C277 312 221 308 183 288
           Z"
      />
    </mask>
  </defs>

  <rect
    class="icon-bg"
    x="40"
    y="40"
    width="432"
    height="432"
    rx="92"
    fill="var(--harvor-icon-color, #3566F5)"
    mask="url(#h-cutout)"
  />
</svg>
