name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: "npm"
      - name: Check Node.js version
        run: node -v
      - name: Install dependencies
        run: npm ci
      - name: Cache ESLint results
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.js', '.prettierrc', '.nvmrc') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Lint code
        run: npm run lint

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Cache TypeScript incremental build info
        uses: actions/cache@v5
        with:
          path: "*.tsbuildinfo"
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig*.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
